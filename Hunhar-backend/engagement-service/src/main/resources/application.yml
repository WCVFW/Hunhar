server:
  port: ${PORT:8084}

spring:
  config:
    # Secrets and settings come from Hunhar-backend/.env (see .env.example). Real environment variables override it.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: engagement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:theunoia_engagement}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

theunoia:
  internal:
    # Shared key for service-to-service /internal/** calls (same value in every service)
    key: ${INTERNAL_API_KEY:hunhar-internal-dev-key-change-me}
  cors:
    # Origins allowed to open the /ws chat socket (same list as the gateway)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hunhar.in:[*],https://*.hunhar.in:[*],http://localhost:[*],https://localhost:[*],http://127.0.0.1:[*]}
  whatsapp:
    # Meta WhatsApp Cloud API (Business Manager > WhatsApp > API Setup). Empty = WhatsApp alerts are skipped.
    phone-number-id: ${WHATSAPP_PHONE_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
