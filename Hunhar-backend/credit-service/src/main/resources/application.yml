server:
  port: ${PORT:8084}
  shutdown: graceful

spring:
  application:
    name: credit-service
  config:
    import: optional:classpath:service-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_db}
    username: ${DB_USER:credit_user}
    password: ${DB_PASSWORD:credit_pass}

theunoia:
  services:
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  credits:
    starter-credits: ${STARTER_CREDITS:20}
  security:
    public-paths:
      - /api/v1/credits/packages
  events:
    subscriptions:
      - user.registered
      - payment.captured
      - payment.failed
      - bid.refund_requested
