server:
  port: ${PORT:8089}
  shutdown: graceful

spring:
  application:
    name: content-service
  config:
    import: optional:classpath:service-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:content_db}
    username: ${DB_USER:content_user}
    password: ${DB_PASSWORD:content_pass}

theunoia:
  content:
    site-url: ${SITE_URL:https://theunoia.com}
  security:
    public-paths:
      - /api/v1/content/**
      - /sitemap.xml
