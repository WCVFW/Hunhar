server:
  port: ${PORT:8091}
  shutdown: graceful

spring:
  application:
    name: file-service
  config:
    import: optional:classpath:service-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file_db}
    username: ${DB_USER:file_user}
    password: ${DB_PASSWORD:file_pass}

theunoia:
  security:
    public-paths:
      - /api/v1/files/public/**
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:ap-south-1}
    bucket: ${S3_BUCKET:theunoia-files}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    create-bucket: ${S3_CREATE_BUCKET:true}
