server:
  port: ${PORT:8085}
  shutdown: graceful

spring:
  application:
    name: payment-service
  config:
    import: optional:classpath:service-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USER:payment_user}
    password: ${DB_PASSWORD:payment_pass}

theunoia:
  services:
    project: ${PROJECT_SERVICE_URL:http://localhost:8083}
  security:
    public-paths:
      - /api/v1/webhooks/**
  payments:
    provider: ${PAYMENT_PROVIDER:mock}              # mock | razorpay | cashfree
    payout-provider: ${PAYOUT_PROVIDER:mock}        # mock | razorpayx
    commission-rate: ${PLATFORM_COMMISSION_RATE:0.10}
    gst-rate: ${GST_RATE:0.18}
    min-withdrawal: ${MIN_WITHDRAWAL:500.00}
    encryption-key: ${PAYMENT_ENCRYPTION_KEY:ZGV2LW9ubHktMzItYnl0ZS1hZXMta2V5LWNoYW5nZSE=}
    invoice-prefix: ${INVOICE_PREFIX:TNU}
    company-name: ${COMPANY_NAME:THEUNOiA Technologies Pvt. Ltd.}
    company-gstin: ${COMPANY_GSTIN:}
    company-address: ${COMPANY_ADDRESS:India}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      payout-account-number: ${RAZORPAYX_ACCOUNT_NUMBER:}
    cashfree:
      client-id: ${CASHFREE_CLIENT_ID:}
      client-secret: ${CASHFREE_CLIENT_SECRET:}
      base-url: ${CASHFREE_PG_BASE_URL:https://sandbox.cashfree.com/pg}
  events:
    subscriptions:
      - milestone.approved
      - dispute.resolved
