server:
  port: ${PORT:8081}

spring:
  application:
    name: identity-service
  config:
    # Local secrets (MAIL_USERNAME, MAIL_PASSWORD, ...) from Hunhar-backend/.env when started from that folder
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:theunoia_identity}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false
  mail:
    # SMTP settings for OTP emails. For Gmail use an App Password (Google Account > Security > App passwords).
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

theunoia:
  internal:
    # Shared key for service-to-service /internal/** calls (same value in every service)
    key: ${INTERNAL_API_KEY:hunhar-internal-dev-key-change-me}
  google:
    # OAuth 2.0 Web client id from Google Cloud Console (APIs & Services > Credentials). Empty = Google sign-in disabled.
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    # The platform admin account is created on startup from these (set them in Hunhar-backend/.env)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Hunhar Admin}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@hunhar.in}}
    from-name: ${MAIL_FROM_NAME:Hunhar}
  otp:
    length: 6
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
    max-attempts: 5
    # How long a verified OTP stays valid for completing registration
    verified-window-minutes: 30
    # Signup must verify the mobile number by SMS (false = mobile is only format-checked)
    mobile-required: ${MOBILE_OTP_REQUIRED:true}
    # Max SMS codes per number per day (protects the SMS balance)
    mobile-daily-limit: ${MOBILE_OTP_DAILY_LIMIT:5}
    # sms = Fast2SMS sends the code (server side). firebase = Firebase Authentication sends it from the browser
    # (needs FIREBASE_PROJECT_ID + FIREBASE_API_KEY; falls back to sms if they are missing)
    mobile-provider: ${MOBILE_OTP_PROVIDER:sms}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    api-key: ${FIREBASE_API_KEY:}
    auth-domain: ${FIREBASE_AUTH_DOMAIN:}
    app-id: ${FIREBASE_APP_ID:}
  sms:
    fast2sms:
      url: ${FAST2SMS_API_URL:https://www.fast2sms.com/dev/bulkV2}
      api-key: ${FAST2SMS_API_KEY:}
      # otp = OTP route (needs website verification in Fast2SMS), q = Quick SMS (needs a Rs 100+ recharge once), auto = otp then q
      route: ${FAST2SMS_ROUTE:auto}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
