server:
  port: ${PORT:8082}

spring:
  config:
    # Secrets and settings come from Hunhar-backend/.env (see .env.example). Real environment variables override it.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: project-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:theunoia_project}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

theunoia:
  internal:
    # Shared key for service-to-service /internal/** calls (same value in every service)
    key: ${INTERNAL_API_KEY:hunhar-internal-dev-key-change-me}
  billing-service:
    url: ${BILLING_SERVICE_URL:http://localhost:8083}
  uploads:
    # Where uploaded project files are stored. Use a persistent volume in production.
    dir: ${UPLOADS_DIR:./uploads}
  storage:
    # local = files on this server's disk (UPLOADS_DIR); s3 = Amazon S3 (recommended in production)
    type: ${STORAGE_TYPE:local}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-south-1}
      # Leave empty on AWS servers with an IAM role; otherwise an IAM user key with List/Get/Put/DeleteObject
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
