# Pre-configured Jenkins (started by scripts\setup-jenkins.ps1)
#   UI: http://localhost:8180   login: admin / <JENKINS_ADMIN_PASSWORD>
name: theunoia-jenkins

services:
  jenkins:
    build: .
    image: theunoia/jenkins:local
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
      DOCKER_REGISTRY_USER: ${DOCKER_REGISTRY_USER:-unused}
      DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD:-unused}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock          # build images with the Docker Desktop engine
      - ../:/workspace/theunoia-backend:ro                 # the Git repository the pipeline builds
      - ./.runtime:/run/theunoia:ro                        # kubeconfig + secrets prepared by setup-jenkins.ps1
    extra_hosts:
      - "kubernetes.docker.internal:host-gateway"          # Docker Desktop Kubernetes API from inside the container
    deploy:
      resources:
        limits: { memory: 3g }

volumes:
  jenkins_home:
