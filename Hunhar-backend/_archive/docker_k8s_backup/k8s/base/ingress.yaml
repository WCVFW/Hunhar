# Public entry: only the API gateway is exposed (plus the object-storage endpoint used by
# presigned download URLs). TLS certificates are issued by cert-manager (Let's Encrypt).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: theunoia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"     # long-lived WebSocket chat connections
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.theunoia.com, files.theunoia.com]
      secretName: theunoia-tls
  rules:
    - host: api.theunoia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
    - host: files.theunoia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port: { number: 9000 }
