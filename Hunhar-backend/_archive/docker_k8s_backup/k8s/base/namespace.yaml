apiVersion: v1
kind: Namespace
metadata:
  name: theunoia
  labels:
    app.kubernetes.io/part-of: theunoia
    # Pod Security Admission: in-cluster infra images (postgres, rabbitmq, minio) need "baseline";
    # every application pod is fully "restricted"-compliant (warnings surface any regression).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: theunoia-app
automountServiceAccountToken: false
