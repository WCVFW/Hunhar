# In-cluster PostgreSQL 16 for dev/staging. Production overlay removes it in favour of a
# managed, highly-available instance (Amazon RDS / Cloud SQL / Azure Flexible Server).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: theunoia, app.kubernetes.io/component: data }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: theunoia, app.kubernetes.io/component: data }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: theunoia, app.kubernetes.io/component: data }
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=300", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=500"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: theunoia-secrets, key: postgres-password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# Idempotent provisioning of one database + least-privilege role per microservice.
# Works against the in-cluster StatefulSet or a managed server (set DB_HOST in the ConfigMap).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-provisioner
  labels: { app.kubernetes.io/name: db-provisioner, app.kubernetes.io/part-of: theunoia }
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: db-provisioner, app.kubernetes.io/part-of: theunoia }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: postgres:16-alpine
          command: ["bash", "-c", "until pg_isready; do sleep 2; done; bash /scripts/init-databases.sh"]
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef: { name: theunoia-config, key: DB_HOST }
            - name: POSTGRES_USER
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: theunoia-secrets, key: postgres-password }
            - { name: AUTH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: auth-db-password } } }
            - { name: USER_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: user-db-password } } }
            - { name: PROJECT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: project-db-password } } }
            - { name: CREDIT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: credit-db-password } } }
            - { name: PAYMENT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: payment-db-password } } }
            - { name: MESSAGING_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: messaging-db-password } } }
            - { name: NOTIFICATION_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: notification-db-password } } }
            - { name: COMMUNITY_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: community-db-password } } }
            - { name: CONTENT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: content-db-password } } }
            - { name: ANALYTICS_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: analytics-db-password } } }
            - { name: FILE_DB_PASSWORD, valueFrom: { secretKeyRef: { name: theunoia-secrets, key: file-db-password } } }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: db-init-script
