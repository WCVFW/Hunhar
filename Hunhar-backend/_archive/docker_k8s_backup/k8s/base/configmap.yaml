apiVersion: v1
kind: ConfigMap
metadata:
  name: theunoia-config
  labels:
    app.kubernetes.io/part-of: theunoia
data:
  # ----- infrastructure endpoints (in-cluster DNS) -----
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_POOL_SIZE: "10"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: theunoia
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  # ----- service discovery: Kubernetes Services (no Eureka needed) -----
  AUTH_SERVICE_URL: http://auth-service:8081
  USER_SERVICE_URL: http://user-service:8082
  PROJECT_SERVICE_URL: http://project-service:8083
  CREDIT_SERVICE_URL: http://credit-service:8084
  PAYMENT_SERVICE_URL: http://payment-service:8085
  MESSAGING_SERVICE_URL: http://messaging-service:8086
  NOTIFICATION_SERVICE_URL: http://notification-service:8087
  COMMUNITY_SERVICE_URL: http://community-service:8088
  CONTENT_SERVICE_URL: http://content-service:8089
  ANALYTICS_SERVICE_URL: http://analytics-service:8090
  FILE_SERVICE_URL: http://file-service:8091

  # ----- application -----
  SPRING_PROFILES_ACTIVE: kubernetes
  LOG_LEVEL: INFO
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
  FRONTEND_URL: https://theunoia.com
  PUBLIC_API_URL: https://api.theunoia.com
  SITE_URL: https://theunoia.com
  CORS_ALLOWED_ORIGINS: https://theunoia.com,https://www.theunoia.com,https://admin.theunoia.com
  KYC_PROVIDER: cashfree
  PAYMENT_PROVIDER: razorpay
  PAYOUT_PROVIDER: razorpayx
  PLATFORM_COMMISSION_RATE: "0.10"
  WHATSAPP_ENABLED: "true"
  GOOGLE_REDIRECT_URI: https://api.theunoia.com/api/v1/calendar/google/callback
  SMTP_HOST: email-smtp.ap-south-1.amazonaws.com
  SMTP_PORT: "587"
  SMTP_AUTH: "true"
  SMTP_STARTTLS: "true"
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://files.theunoia.com
  S3_BUCKET: theunoia-files
  S3_REGION: ap-south-1
  S3_CREATE_BUCKET: "true"
