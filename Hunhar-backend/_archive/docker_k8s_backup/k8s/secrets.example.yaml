# TEMPLATE ONLY - never commit real values.
# Create the real secret out-of-band (External Secrets Operator / Sealed Secrets / Vault), e.g.:
#   kubectl -n theunoia create secret generic theunoia-secrets --from-env-file=secrets.env
# Jenkins does this automatically from its credential store during deployment (see Jenkinsfile).
apiVersion: v1
kind: Secret
metadata:
  name: theunoia-secrets
  namespace: theunoia
type: Opaque
stringData:
  # platform
  jwt-secret: "<openssl rand -base64 48>"
  internal-service-token: "<openssl rand -hex 32>"
  payment-encryption-key: "<openssl rand -base64 32>"
  notification-encryption-key: "<openssl rand -base64 32>"
  admin-email: "admin@theunoia.com"
  admin-password: "<strong password>"
  # infrastructure
  postgres-password: "<postgres superuser password>"
  rabbitmq-password: "<rabbitmq password>"
  redis-password: "<redis password>"
  s3-access-key: "<minio/s3 access key>"
  s3-secret-key: "<minio/s3 secret key>"
  # one database role per service
  auth-db-password: "<...>"
  user-db-password: "<...>"
  project-db-password: "<...>"
  credit-db-password: "<...>"
  payment-db-password: "<...>"
  messaging-db-password: "<...>"
  notification-db-password: "<...>"
  community-db-password: "<...>"
  content-db-password: "<...>"
  analytics-db-password: "<...>"
  file-db-password: "<...>"
  # third-party integrations
  razorpay-key-id: ""
  razorpay-key-secret: ""
  razorpay-webhook-secret: ""
  razorpayx-account-number: ""
  cashfree-client-id: ""
  cashfree-client-secret: ""
  whatsapp-phone-number-id: ""
  whatsapp-access-token: ""
  google-client-id: ""
  google-client-secret: ""
  smtp-username: ""
  smtp-password: ""
