# Staging only: catches every outgoing email (verification links, invoices).
#   kubectl -n theunoia-staging port-forward svc/mailhog 8025:8025   ->  http://localhost:8025
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels: { app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: theunoia, app.kubernetes.io/component: data }
spec:
  selector: { app.kubernetes.io/name: mailhog }
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  labels: { app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: theunoia, app.kubernetes.io/component: data }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailhog }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailhog, app.kubernetes.io/part-of: theunoia, app.kubernetes.io/component: data }
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
