# Staging: self-contained cluster footprint (in-cluster PostgreSQL / RabbitMQ / Redis / MinIO),
# single replicas, sandbox integrations.   kubectl apply -k k8s/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: theunoia-staging

resources:
  - ../../base
  - mailhog.yaml

patches:
  - target: { kind: Namespace, name: theunoia }
    patch: |-
      - op: replace
        path: /metadata/name
        value: theunoia-staging
  - target: { kind: Deployment, labelSelector: "app.kubernetes.io/part-of=theunoia" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # small footprint so all 12 services fit on a laptop (Docker Desktop Kubernetes)
  - target: { kind: Deployment, labelSelector: "app.kubernetes.io/component in (backend,edge)" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 25m, memory: 256Mi }
          limits: { cpu: "1", memory: 512Mi }
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 90
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target: { kind: Ingress, name: theunoia }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: [api.staging.theunoia.com, files.staging.theunoia.com]
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.theunoia.com
      - op: replace
        path: /spec/rules/1/host
        value: files.staging.theunoia.com
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
  - target: { kind: ConfigMap, name: theunoia-config }
    patch: |-
      - op: replace
        path: /data/FRONTEND_URL
        value: https://staging.theunoia.com
      - op: replace
        path: /data/PUBLIC_API_URL
        value: https://api.staging.theunoia.com
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: https://staging.theunoia.com,http://localhost:3000
      - op: replace
        path: /data/SITE_URL
        value: https://staging.theunoia.com
      - op: replace
        path: /data/GOOGLE_REDIRECT_URI
        value: https://api.staging.theunoia.com/api/v1/calendar/google/callback
      - op: replace
        path: /data/S3_PUBLIC_ENDPOINT
        value: https://files.staging.theunoia.com
      - op: replace
        path: /data/KYC_PROVIDER
        value: mock
      - op: replace
        path: /data/PAYMENT_PROVIDER
        value: razorpay        # Razorpay test-mode keys in the staging secret
      - op: replace
        path: /data/PAYOUT_PROVIDER
        value: mock
      - op: replace
        path: /data/WHATSAPP_ENABLED
        value: "false"
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
      - op: replace
        path: /data/JAVA_OPTS
        value: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
      - op: replace
        path: /data/SMTP_HOST
        value: mailhog
      - op: replace
        path: /data/SMTP_PORT
        value: "1025"
      - op: replace
        path: /data/SMTP_AUTH
        value: "false"
      - op: replace
        path: /data/SMTP_STARTTLS
        value: "false"
