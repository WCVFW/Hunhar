# Production: managed, highly-available PostgreSQL (Amazon RDS Multi-AZ) and Amazon S3 replace the
# in-cluster StatefulSets; HPA-driven scaling with >= 2 replicas per service.
#   kubectl apply -k k8s/overlays/production
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: theunoia

resources:
  - ../../base

patches:
  # ---- use managed PostgreSQL & S3 instead of in-cluster pods
  - target: { kind: StatefulSet, name: postgres }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target: { kind: Service, name: postgres }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target: { kind: StatefulSet, name: minio }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: minio
  - target: { kind: Service, name: minio }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: minio
  - target: { kind: NetworkPolicy, name: minio-from-ingress-controller }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: minio-from-ingress-controller
  - target: { kind: Ingress, name: theunoia }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: [api.theunoia.com]
      - op: remove
        path: /spec/rules/1
  - target: { kind: ConfigMap, name: theunoia-config }
    patch: |-
      - op: replace
        path: /data/DB_HOST
        value: theunoia-prod.cluster-xxxxxxxx.ap-south-1.rds.amazonaws.com
      - op: replace
        path: /data/DB_POOL_SIZE
        value: "15"
      - op: replace
        path: /data/S3_ENDPOINT
        value: ""
      - op: replace
        path: /data/S3_PUBLIC_ENDPOINT
        value: ""
      - op: replace
        path: /data/S3_CREATE_BUCKET
        value: "false"
  # ---- capacity for the money paths
  - target: { kind: Deployment, name: "(payment-service|project-service|api-gateway)" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 500m, memory: 768Mi }
          limits: { cpu: "2", memory: 1Gi }
  - target: { kind: HorizontalPodAutoscaler, name: "(payment-service|project-service|api-gateway|messaging-service)" }
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 10
