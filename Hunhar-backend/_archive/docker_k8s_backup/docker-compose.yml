# THEUNOiA - complete local stack: 12 Spring Boot services + PostgreSQL + Redis + RabbitMQ + MinIO + MailHog
#   cp .env.example .env && docker compose up -d --build
#   API gateway  : http://localhost:8080
#   RabbitMQ UI  : http://localhost:15672   MinIO console: http://localhost:9001   MailHog: http://localhost:8025

name: theunoia

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: docker
  DB_HOST: postgres
  DB_PORT: 5432
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-theunoia}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-theunoia}
  REDIS_HOST: redis
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
  JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0zMmJ5dGVzIQ==}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  AUTH_SERVICE_URL: http://auth-service:8081
  USER_SERVICE_URL: http://user-service:8082
  PROJECT_SERVICE_URL: http://project-service:8083
  CREDIT_SERVICE_URL: http://credit-service:8084
  PAYMENT_SERVICE_URL: http://payment-service:8085
  MESSAGING_SERVICE_URL: http://messaging-service:8086
  NOTIFICATION_SERVICE_URL: http://notification-service:8087
  COMMUNITY_SERVICE_URL: http://community-service:8088
  CONTENT_SERVICE_URL: http://content-service:8089
  ANALYTICS_SERVICE_URL: http://analytics-service:8090
  FILE_SERVICE_URL: http://file-service:8091
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }
  deploy:
    resources:
      limits: { memory: 512m }

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -lqt | cut -d '|' -f1 | grep -qw file_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-theunoia}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-theunoia}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]

  # ------------------------------------------------------------------ edge
  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    image: theunoia/api-gateway:local
    restart: unless-stopped
    environment:
      <<: *service-env
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }

  # ------------------------------------------------------------------ microservices
  auth-service:
    <<: *service
    build: { context: ., args: { SERVICE: auth-service } }
    image: theunoia/auth-service:local
    environment:
      <<: *service-env
      PORT: 8081
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@theunoia.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      CASHFREE_CLIENT_ID: ${CASHFREE_CLIENT_ID:-}
      CASHFREE_CLIENT_SECRET: ${CASHFREE_CLIENT_SECRET:-}

  user-service:
    <<: *service
    build: { context: ., args: { SERVICE: user-service } }
    image: theunoia/user-service:local
    environment:
      <<: *service-env
      PORT: 8082
      DB_NAME: user_db
      DB_USER: user_user
      DB_PASSWORD: ${USER_DB_PASSWORD:-user_pass}

  project-service:
    <<: *service
    build: { context: ., args: { SERVICE: project-service } }
    image: theunoia/project-service:local
    environment:
      <<: *service-env
      PORT: 8083
      DB_NAME: project_db
      DB_USER: project_user
      DB_PASSWORD: ${PROJECT_DB_PASSWORD:-project_pass}

  credit-service:
    <<: *service
    build: { context: ., args: { SERVICE: credit-service } }
    image: theunoia/credit-service:local
    environment:
      <<: *service-env
      PORT: 8084
      DB_NAME: credit_db
      DB_USER: credit_user
      DB_PASSWORD: ${CREDIT_DB_PASSWORD:-credit_pass}

  payment-service:
    <<: *service
    build: { context: ., args: { SERVICE: payment-service } }
    image: theunoia/payment-service:local
    environment:
      <<: *service-env
      PORT: 8085
      DB_NAME: payment_db
      DB_USER: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pass}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-mock}
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-0.10}
      PAYMENT_ENCRYPTION_KEY: ${PAYMENT_ENCRYPTION_KEY:-ZGV2LW9ubHktMzItYnl0ZS1hZXMta2V5LWNoYW5nZSE=}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
      CASHFREE_CLIENT_ID: ${CASHFREE_CLIENT_ID:-}
      CASHFREE_CLIENT_SECRET: ${CASHFREE_CLIENT_SECRET:-}

  messaging-service:
    <<: *service
    build: { context: ., args: { SERVICE: messaging-service } }
    image: theunoia/messaging-service:local
    environment:
      <<: *service-env
      PORT: 8086
      DB_NAME: messaging_db
      DB_USER: messaging_user
      DB_PASSWORD: ${MESSAGING_DB_PASSWORD:-messaging_pass}

  notification-service:
    <<: *service
    build: { context: ., args: { SERVICE: notification-service } }
    image: theunoia/notification-service:local
    environment:
      <<: *service-env
      PORT: 8087
      DB_NAME: notification_db
      DB_USER: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_pass}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-ZGV2LW9ubHktMzItYnl0ZS1hZXMta2V5LWNoYW5nZSE=}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

  community-service:
    <<: *service
    build: { context: ., args: { SERVICE: community-service } }
    image: theunoia/community-service:local
    environment:
      <<: *service-env
      PORT: 8088
      DB_NAME: community_db
      DB_USER: community_user
      DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-community_pass}

  content-service:
    <<: *service
    build: { context: ., args: { SERVICE: content-service } }
    image: theunoia/content-service:local
    environment:
      <<: *service-env
      PORT: 8089
      DB_NAME: content_db
      DB_USER: content_user
      DB_PASSWORD: ${CONTENT_DB_PASSWORD:-content_pass}

  analytics-service:
    <<: *service
    build: { context: ., args: { SERVICE: analytics-service } }
    image: theunoia/analytics-service:local
    environment:
      <<: *service-env
      PORT: 8090
      DB_NAME: analytics_db
      DB_USER: analytics_user
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics_pass}

  file-service:
    <<: *service
    build: { context: ., args: { SERVICE: file-service } }
    image: theunoia/file-service:local
    environment:
      <<: *service-env
      PORT: 8091
      DB_NAME: file_db
      DB_USER: file_user
      DB_PASSWORD: ${FILE_DB_PASSWORD:-file_pass}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_CREATE_BUCKET: "true"

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
