server:
  port: ${PORT:8080}

spring:
  config:
    # Secrets and settings come from Hunhar-backend/.env (see .env.example). Real environment variables override it.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Identity Service Routes (Auth, User Profiles, KYC, Leaderboard)
        - id: identity-service-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/kyc/**, /api/v1/leaderboard/**

        # Project Service Routes (Projects, Bids, Workspace, Collaboration, Disputes)
        - id: project-service
          uri: ${PROJECT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/projects/**, /api/v1/bids/**, /api/v1/workspace/**, /api/v1/collaborations/**, /api/v1/disputes/**

        # Billing Service Routes (Wallet, Payments, Credits, Invoices, Payouts, Webhooks)
        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/wallets/**, /api/v1/credits/**, /api/v1/invoices/**, /api/v1/payouts/**, /api/v1/webhooks/**

        # Engagement Service Routes (Messaging, WhatsApp/Notifications, Calendar, Forum, CMS, Analytics)
        - id: engagement-service
          uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/messages/**, /api/v1/notifications/**, /api/v1/calendar/**, /api/v1/community/**, /api/v1/content/**, /api/v1/analytics/**, /ws/**

theunoia:
  cors:
    # Browser origins allowed to call the API (comma separated; * = any subdomain, :[*] = any port incl. none).
    # Default: https://hunhar.in, https://www.hunhar.in and every other https://<sub>.hunhar.in, plus localhost/127.0.0.1 on any port.
    # http://*.hunhar.in is left out on purpose: the live site redirects http to https (HSTS), so no real page has an http origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hunhar.in:[*],https://*.hunhar.in:[*],http://localhost:[*],https://localhost:[*],http://127.0.0.1:[*]}
  gateway:
    jwt-secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    encryption:
      # true = every /api/** call must use the encrypted envelope (the web app always does). false = plain JSON also accepted.
      required: ${API_ENCRYPTION_REQUIRED:true}
      # true = plain JSON is still accepted on requests that reach the gateway port directly (SSH tunnel), never through nginx
      allow-direct-plain: ${API_ALLOW_DIRECT_PLAIN:true}
      # "<pkcs8-base64>.<x509-base64>"; leave empty to use (and on first start create) the key file below
      key-pair: ${API_ENC_KEY_PAIR:}
      key-file: ${API_ENC_KEY_FILE:.api-enc-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
