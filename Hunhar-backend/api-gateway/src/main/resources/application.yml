server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

theunoia:
  gateway:
    jwt-secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0zMmJ5dGVzIQ==}
    internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-change-me}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    services:
      auth: ${AUTH_SERVICE_URL:http://localhost:8081}
      user: ${USER_SERVICE_URL:http://localhost:8082}
      project: ${PROJECT_SERVICE_URL:http://localhost:8083}
      credit: ${CREDIT_SERVICE_URL:http://localhost:8084}
      payment: ${PAYMENT_SERVICE_URL:http://localhost:8085}
      messaging: ${MESSAGING_SERVICE_URL:http://localhost:8086}
      notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
      community: ${COMMUNITY_SERVICE_URL:http://localhost:8088}
      content: ${CONTENT_SERVICE_URL:http://localhost:8089}
      analytics: ${ANALYTICS_SERVICE_URL:http://localhost:8090}
      file: ${FILE_SERVICE_URL:http://localhost:8091}
    # Authentication optional on these routes (a token, if sent, is still validated & forwarded).
    public-routes:
      - POST /api/v1/auth/register/**
      - POST /api/v1/auth/login
      - POST /api/v1/auth/refresh
      - POST /api/v1/auth/verify-email
      - POST /api/v1/auth/forgot-password
      - POST /api/v1/auth/reset-password
      - GET /api/v1/categories/**
      - GET /api/v1/projects
      - GET /api/v1/projects/*
      - GET /api/v1/users/freelancers/**
      - GET /api/v1/users/leaderboard
      - GET /api/v1/reviews/**
      - GET /api/v1/credits/packages
      - POST /api/v1/webhooks/**
      - GET /api/v1/content/**
      - POST /api/v1/content/contact
      - POST /api/v1/content/leads
      - GET /sitemap.xml
      - GET /api/v1/community/**
      - GET /api/v1/calendar/google/callback
      - GET /api/v1/files/public/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false   # Redis is non-critical here: rate limiting + suspension deny-list fail open
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
