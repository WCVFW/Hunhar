server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: user-service
  config:
    import: optional:classpath:service-defaults.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USER:user_user}
    password: ${DB_PASSWORD:user_pass}

theunoia:
  security:
    public-paths:
      - /api/v1/users/freelancers/**
      - /api/v1/users/clients/**
      - /api/v1/users/leaderboard
  events:
    subscriptions:
      - user.registered
      - user.email_verified
      - user.kyc_verified
      - user.awaiting_approval
      - user.approved
      - user.rejected
      - user.suspended
      - user.reactivated
      - project.completed
      - project.cancelled
      - review.created
      - escrow.released
      - direct_payment.confirmed
      - messaging.response_stats
