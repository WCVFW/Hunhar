# Jenkins behind nginx — installed by setup-jenkins-server.sh. Jenkins itself listens on 127.0.0.1:8080 only.
# certbot --nginx -d jenkins.hunhar.in --redirect adds HTTPS to this block.
upstream jenkins {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $jenkins_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jenkins.hunhar.in;

    # Plugin uploads, large build logs
    client_max_body_size 100m;

    location / {
        proxy_pass         http://jenkins;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        # Jenkins agents and the live console use websockets
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $jenkins_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering    off;
    }
}
