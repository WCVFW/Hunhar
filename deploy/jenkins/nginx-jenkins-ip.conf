# Jenkins on the server's IP: http://<server-ip>:8090 -> Jenkins (127.0.0.1:8091).
# Used when Jenkins shares the live server. Open port 8090 in the AWS security group for your IP only.
# Needs nginx-jenkins.conf (it defines the "jenkins" upstream and $jenkins_connection_upgrade).
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 100m;

    location / {
        proxy_pass         http://jenkins;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $jenkins_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering    off;
    }
}
