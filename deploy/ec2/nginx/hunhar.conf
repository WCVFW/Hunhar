# Hunhar on EC2 — installed to /etc/nginx/sites-available/hunhar.conf by setup-server.sh.
# Starts as plain HTTP; then
#   sudo certbot --nginx -d hunhar.in -d www.hunhar.in -d api.hunhar.in --redirect
# adds HTTPS to every block below and the http->https redirects.

upstream hunhar_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# API: https://api.hunhar.in  ->  Spring Cloud Gateway (port 8080, never exposed directly)
# DNS: an A record for api.hunhar.in pointing at this instance's Elastic IP
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.hunhar.in;

    # Project files are up to 20 MB (25 MB per request)
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health is public (uptime monitors); every other actuator endpoint stays private
    location = /actuator/health {
        proxy_pass http://hunhar_gateway;
    }
    location /actuator {
        return 404;
    }

    # Chat (STOMP over WebSocket / SockJS)
    location /ws {
        proxy_pass http://hunhar_gateway;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://hunhar_gateway;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

# -----------------------------------------------------------------------------
# Website: https://www.hunhar.in  (React build in /var/www/hunhar, published by `sudo hunhar-deploy`)
# DNS: A records for @ and www pointing at this instance's Elastic IP
# -----------------------------------------------------------------------------

# hunhar.in -> www.hunhar.in (one canonical address, same as before on Vercel)
server {
    listen 80;
    listen [::]:80;
    server_name hunhar.in;
    return 301 https://www.hunhar.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.hunhar.in;

    root /var/www/hunhar;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # (add_header in a location replaces the server-level ones, so each location repeats them)

    # Hashed build files (index-AbC123.js) never change: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Files from public/ (favicon etc.)
    location ~* \.(png|svg|ico|jpg|jpeg|webp|txt|xml)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Single-page app: every route (/login, /freelancer/dashboard, ...) serves index.html,
    # which is never cached so a new deploy shows up immediately
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=63072000" always;
        try_files $uri $uri/ /index.html;
    }
}
