# Website + API on one address. Installed to /etc/nginx/snippets/hunhar-site.conf and included by the
# www.hunhar.in block and the bare-IP block in hunhar.conf. The website calls /api/... on its own address.
# (Refreshed on every install; certbot never edits this file.)

root /var/www/hunhar;
index index.html;

# Project files are up to 20 MB (25 MB per request)
client_max_body_size 30m;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# API -> Spring Cloud Gateway. ^~ so file-type rules below never catch an API path.
location ^~ /api/ {
    proxy_pass http://hunhar_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

# Chat (STOMP over WebSocket / SockJS)
location ^~ /ws {
    proxy_pass http://hunhar_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# (add_header in a location replaces the server-level ones, so each location repeats them)

# Hashed build files (index-AbC123.js) never change: cache for a year
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
}

# Files from public/ (favicon etc.)
location ~* \.(png|svg|ico|jpg|jpeg|webp|txt|xml)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
}

# Single-page app: every route (/login, /freelancer/dashboard, ...) serves index.html,
# which is never cached so a new deploy shows up immediately
location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ /index.html;
}
